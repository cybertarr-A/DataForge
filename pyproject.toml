[project]
name = "dataforge"
version = "0.1.0"
description = "Modular data collection and processing engine"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]